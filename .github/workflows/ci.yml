name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      API_HOST: 127.0.0.1
      API_PORT: 4000
      LOG_LEVEL: info
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: zuridesk_test
      WEB_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      EXPO_PUBLIC_API_URL: http://localhost:4000/v1
      ZURIDESK_MONGO_PORT: 27017

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Verify repository boundaries and tracked files
        run: |
          node scripts/verify-boundaries.mjs
          node scripts/verify-no-secrets.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Start MongoDB replica set
        run: docker compose -f infra/compose.mongo.yml up --detach --wait

      - name: Run integration tests
        run: pnpm test:integration

      - name: Verify generated API artifacts
        run: pnpm check:api

      - name: Build
        run: pnpm build

      - name: Show MongoDB diagnostics after failure
        if: failure()
        run: docker compose -f infra/compose.mongo.yml logs --no-color mongodb

      - name: Stop MongoDB
        if: always()
        run: docker compose -f infra/compose.mongo.yml down --volumes

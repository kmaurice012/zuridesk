name: zuridesk-local

services:
  mongodb:
    image: mongo:8.0.12
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "127.0.0.1:${ZURIDESK_MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "
            try {
              if (db.hello().isWritablePrimary) quit(0);
              rs.status();
              quit(1);
            } catch (error) {
              try {
                rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
              } catch (initError) {}
              quit(1);
            }
          "
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  mongodb_data:
